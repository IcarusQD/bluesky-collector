name: Collect Bluesky data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect Bluesky data
        env:
          BLUESKY_ACTOR: pluperfectidiot.bsky.social
        run: python collector.py

      - name: Save collected data
        run: |
          git config user.name "bluesky-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Collect Bluesky metrics"
          git push
